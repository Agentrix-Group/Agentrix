paths:
  /api/v1/auth/login:
    post:
      summary: Authenticate user and obtain JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/LoginResponse'
        '400':
          $ref: './components/errors.yaml#/BadRequest'
        '401':
          $ref: './components/errors.yaml#/Unauthorized'

  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'
        '400':
          $ref: './components/errors.yaml#/BadRequest'
        '409':
          $ref: './components/errors.yaml#/Conflict'

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Refreshed token
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Token'

  /api/v1/me:
    get:
      summary: Get authenticated user session
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/User'
        '401':
          $ref: './components/errors.yaml#/Unauthorized'
