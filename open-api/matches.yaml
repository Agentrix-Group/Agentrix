paths:
  /api/v1/matches:
    get:
      summary: List matches
      tags:
        - Matches
      security: []
      parameters:
        - name: contest_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/Match'
    post:
      summary: Schedule a new match between submissions
      tags:
        - Matches
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contest_id:
                  type: string
                game_id:
                  type: string
                submission_ids:
                  type: array
                  items:
                    type: string
                seed:
                  type: integer
              required:
                - game_id
      responses:
        '201':
          description: Match scheduled
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'

  /api/v1/matches/{id}:
    get:
      summary: Get match details by ID
      tags:
        - Matches
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match details
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Match'
    put:
      summary: Update match
      tags:
        - Matches
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/Match'
      responses:
        '200':
          description: Match updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'
    patch:
      summary: Activate or deactivate match
      tags:
        - Matches
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'

  /api/v1/matches/{id}/run:
    post:
      summary: Trigger execution of an existing match
      tags:
        - Matches
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Match run accepted
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'
