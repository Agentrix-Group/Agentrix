paths:
  /api/v1/replays/{id}:
    get:
      summary: Get replay metadata
      tags:
        - Replays
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Replay data
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Replay'
        '404':
          $ref: './components/errors.yaml#/NotFound'

  /api/v1/replays/{id}/stream:
    get:
      summary: Stream the authoritative NDJSON replay
      tags:
        - Replays
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Metadata line, sequential public snapshots, and final result line
          content:
            application/x-ndjson:
              schema:
                type: string
        '404':
          $ref: './components/errors.yaml#/NotFound'
