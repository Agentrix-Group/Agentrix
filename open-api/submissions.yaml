paths:
  /api/v1/submissions:
    get:
      summary: List agent code submissions
      tags:
        - Submissions
      security:
        - bearerAuth: []
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/Submission'
  /api/v1/submissions/{id}:
    get:
      summary: Get submission by ID
      tags:
        - Submissions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission details
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Submission'
  /api/v1/submissions/upload:
    post:
      summary: Validate and admit a Starfighter Python bot ZIP
      tags:
        - Submissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [agent_id, bundle]
              properties:
                agent_id:
                  type: string
                bundle:
                  type: string
                  format: binary
                  description: ZIP up to 2 MiB containing root files agentrix.json and bot.py
      responses:
        '201':
          description: Bot passed syntax, initialization, and tick 0 admission
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Submission'
        '400':
          description: Invalid ZIP, manifest, Python syntax, or protocol response
