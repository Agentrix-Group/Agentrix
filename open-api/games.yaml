paths:
  /api/v1/games:
    get:
      summary: List supported games
      tags:
        - Games
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/Game'
  /api/v1/games/{id}:
    get:
      summary: Get game manifest and metadata
      tags:
        - Games
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Game'
