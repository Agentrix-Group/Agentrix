paths:
  /api/v1/contests:
    get:
      summary: List public contests
      description: Returns a list of contests available publicly. Draft contests are excluded by default.
      tags:
        - Contests
      parameters:
        - name: state
          in: query
          required: false
          description: Optional filter by specific public contest state
          schema:
            type: string
            enum:
              - published
              - registration_open
              - preparation
              - in_progress
              - final_selection
              - live_final
              - finished
              - archived
              - suspended
              - cancelled
        - name: include_archived
          in: query
          required: false
          description: When true, include archived contests in results
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of public contests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/PublicContestSummary'
        '400':
          $ref: './components/errors.yaml#/BadRequest'
        '500':
          $ref: './components/errors.yaml#/InternalServerError'
    post:
      summary: Create a new contest
      tags:
        - Contests
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/Contest'
      responses:
        '201':
          description: Contest created
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'

  /api/v1/contests/{id}:
    get:
      summary: Get contest details by ID
      description: Returns details of a contest. Draft contests return 404 for unauthenticated or non-admin requests.
      tags:
        - Contests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contest details
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Contest'
        '404':
          $ref: './components/errors.yaml#/NotFound'
    put:
      summary: Update contest
      tags:
        - Contests
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/Contest'
      responses:
        '200':
          description: Contest updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'
    patch:
      summary: Activate or deactivate contest
      tags:
        - Contests
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Contest status updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'

  /api/v1/contests/{id}/agents:
    get:
      summary: List agents enrolled in a contest
      tags:
        - Contests
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of enrolled rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/Ranking'
        '404':
          $ref: './components/errors.yaml#/NotFound'
    post:
      summary: Enroll an agent into a contest
      tags:
        - Contests
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/EnrollAgentRequest'
      responses:
        '201':
          description: Agent successfully enrolled
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/EnrollAgentResponse'
        '400':
          $ref: './components/errors.yaml#/BadRequest'
        '403':
          $ref: './components/errors.yaml#/Forbidden'
        '404':
          $ref: './components/errors.yaml#/NotFound'
        '409':
          $ref: './components/errors.yaml#/Conflict'

