# Same-origin deployment: the SPA and the API share the origin, so the
# refresh cookie (Path=/api/v1/auth, SameSite=Strict) works without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
