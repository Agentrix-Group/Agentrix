id: starfighter
name: Starfighter Arena
version: 0.3.0-core.1
binary_path: bin/starfighter-engine
description: >
  2D Newtonian space dogfight. Ships move by inertia (thrust, drag, active
  braking), manage a shared health/energy pool, can raise an energy shield
  that reduces incoming bullet damage, and fire cooldown-limited bullets.
  The engine owns the continuous arena dimensions declared in settings.
  Duelo entre dos naves simétricas, sin equipos.
min_players: 2
max_players: 2
max_ticks: 3600
fixed_timestep_ms: 17
reference_agents:
  - id: hunter
    path: games/starfighter/examples/bot_hunter.py
  - id: evasive
    path: games/starfighter/examples/bot_evasive.py
settings:
  # Simulation
  tick_hz: "60"
  arena_width: "2000"
  arena_height: "1000"
  # Ship model
  ship_max_health: "100"
  ship_max_energy: "100"
  bullet_damage: "25"
  asteroid_damage: "100"
  shoot_energy_cost: "15"
  shield_energy_cost_per_tick: "1"
  shield_damage_reduction: "0.7"
  energy_regen_per_tick: "0.5"
  # Perception
  radar_range: "800"
  asteroid_count: "5"
