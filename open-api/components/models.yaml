SuccessResponse:
  type: object
  properties:
    httpStatusCode:
      type: integer
      example: 200
    message:
      type: string
      example: "Operation completed successfully"
  required:
    - httpStatusCode
    - message

Token:
  type: object
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    expires_in:
      type: integer
    token_type:
      type: string
      example: "Bearer"

LoginRequest:
  type: object
  properties:
    username:
      type: string
      example: "admin"
    password:
      type: string
      example: "admin123"
  required:
    - username
    - password

LoginResponse:
  type: object
  properties:
    token:
      $ref: '#/Token'
    user:
      $ref: '#/User'

RegisterRequest:
  type: object
  properties:
    username:
      type: string
      example: "botmaster"
    email:
      type: string
      format: email
      example: "botmaster@example.com"
    password:
      type: string
      format: password
      example: "secretPass123"
  required:
    - username
    - email
    - password

ContestEntry:
  type: object
  properties:
    id:
      type: string
    contest_id:
      type: string
    agent_id:
      type: string
    user_id:
      type: string
    status:
      type: string
      enum: [enrolled, disqualified, withdrawn]
    enrolled_at:
      type: string
      format: date-time
    agent:
      $ref: '#/Agent'
    user:
      $ref: '#/User'

EnrollAgentRequest:
  type: object
  properties:
    agent_id:
      type: string
      example: "agent-1234"
  required:
    - agent_id

EnrollAgentResponse:
  type: object
  properties:
    httpStatusCode:
      type: integer
      example: 201
    message:
      type: string
      example: "Agent enrolled in contest successfully"
    entry:
      $ref: '#/ContestEntry'
    ranking:
      $ref: '#/Ranking'

User:
  type: object
  properties:
    id:
      type: string
    username:
      type: string
    email:
      type: string
    role_id:
      type: string
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

Role:
  type: object
  properties:
    id:
      type: string
    description:
      type: string
    active:
      type: boolean

Permission:
  type: object
  properties:
    id:
      type: string
    description:
      type: string
    active:
      type: boolean

Category:
  type: object
  properties:
    id:
      type: string
    description:
      type: string
    active:
      type: boolean
  required:
    - id
    - description

Game:
  type: object
  properties:
    id:
      const: starfighter
    name:
      type: string
    description:
      type: string
    manifest_path:
      type: string
    min_players:
      const: 2
    max_players:
      const: 2
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

Contest:
  type: object
  properties:
    id:
      type: string
    name:
      type: string
    description:
      type: string
    game_id:
      const: starfighter
    category_id:
      type: string
    start_date:
      type: string
      format: date-time
    end_date:
      type: string
      format: date-time
    status:
      type: string
    active:
      type: boolean
    scoring_policy:
      $ref: '#/ScoringPolicy'
    created_at:
      type: string
      format: date-time

Agent:
  type: object
  properties:
    id:
      type: string
    owner_user_id:
      type: string
    game_id:
      const: starfighter
    name:
      type: string
    description:
      type: string
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

Submission:
  type: object
  properties:
    id:
      type: string
    agent_id:
      type: string
    version:
      type: integer
    code_path:
      type: string
    language:
      const: python
    status:
      type: string
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

Match:
  type: object
  properties:
    id:
      type: string
    contest_id:
      type: string
    game_id:
      const: starfighter
    status:
      type: string
    seed:
      type: integer
    replay_id:
      type: string
    active:
      type: boolean
    created_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time

Result:
  type: object
  properties:
    id:
      type: string
    match_id:
      type: string
    submission_id:
      type: string
    score:
      type: integer
    rank:
      type: integer
    status:
      type: string
    details:
      type: string
    created_at:
      type: string
      format: date-time

Ranking:
  type: object
  properties:
    id:
      type: string
    contest_id:
      type: string
    agent_id:
      type: string
    user_id:
      type: string
    score:
      type: integer
    points:
      type: integer
    matches_played:
      type: integer
    wins:
      type: integer
    losses:
      type: integer
    draws:
      type: integer
    disqualifications:
      type: integer
    tiebreaker_score:
      type: number
      format: double
    rank:
      type: integer
    updated_at:
      type: string
      format: date-time

ScoringPolicy:
  type: object
  properties:
    win_points:
      type: integer
      default: 3
    draw_points:
      type: integer
      default: 1
    loss_points:
      type: integer
      default: 0
    disqualification_penalty:
      type: integer
      default: 0
    tiebreakers:
      type: array
      items:
        type: string
        enum: [score_diff, head_to_head, wins, rival_survival]

RankingSnapshot:
  type: object
  properties:
    id:
      type: string
    contest_id:
      type: string
    version:
      type: integer
    snapshot_data:
      type: array
      items:
        $ref: '#/Ranking'
    published_by:
      type: string
    published_at:
      type: string
      format: date-time

Replay:
  type: object
  properties:
    id:
      type: string
    match_id:
      type: string
    file_path:
      type: string
    duration_ticks:
      type: integer
    summary:
      type: string
    active:
      type: boolean
    created_at:
      type: string
      format: date-time

PublicContestSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
      example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
    name:
      type: string
      example: "Torneo Primavera 2026"
    description:
      type: string
      example: "Concurso universitario de agentes en arena básica"
    state:
      type: string
      enum:
        - published
        - registration_open
        - preparation
        - in_progress
        - final_selection
        - live_final
        - finished
        - archived
        - suspended
        - cancelled
      example: "registration_open"
    starts_at:
      type: string
      format: date-time
      nullable: true
    ends_at:
      type: string
      format: date-time
      nullable: true
  required:
    - id
    - name
    - description
    - state
