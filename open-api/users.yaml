paths:
  /api/v1/users:
    get:
      summary: List registered users
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/User'

  /api/v1/users/{id}:
    get:
      summary: Get user profile by ID
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/User'
        '404':
          $ref: './components/errors.yaml#/NotFound'
    put:
      summary: Update user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/models.yaml#/User'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'
    patch:
      summary: Activate or deactivate user
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: User status updated
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/SuccessResponse'

  /api/v1/me/agents:
    get:
      summary: List agents owned by current authenticated user
      tags:
        - Users
        - Agents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of agents owned by authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/models.yaml#/Agent'
        '401':
          $ref: './components/errors.yaml#/Unauthorized'
