name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (build, vet, race test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agentrix
        uses: actions/checkout@v4

      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          repository: Agentrix-Group/agentrix_engine
          path: agentrix_engine

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install engine and sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build starfighter-engine binary
        run: |
          cargo build --release --bin starfighter-engine --manifest-path agentrix_engine/Cargo.toml
          mkdir -p bin
          cp agentrix_engine/target/release/starfighter-engine bin/
          chmod +x bin/starfighter-engine

      - name: Go Build
        run: go build -mod=readonly ./...

      - name: Go Vet
        run: go vet -mod=readonly ./...

      - name: Go Test with Race Detector
        run: go test -mod=readonly -race ./...

  web:
    name: Web (lint, unit tests, parity, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agentrix
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run Web Unit Tests
        working-directory: web
        run: npm test -- --run

      - name: Run i18n Parity Verification
        working-directory: web
        run: npm run test:parity

      - name: Build Web Application
        working-directory: web
        run: npm run build
