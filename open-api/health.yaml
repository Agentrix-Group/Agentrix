openapi: 3.1.0
info:
  title: Health Probes API
  version: 1.0.0
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 OK if server process is running and accepting connections.
      operationId: getLiveness
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/ready:
    get:
      summary: Readiness probe
      description: Returns 200 OK if server is connected to PostgreSQL and ready to process matches.
      operationId: getReadiness
      responses:
        '200':
          description: Server and dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Database or worker pool is unready
          content:
            application/json:
              schema:
                $ref: './components/models.yaml#/Error'
