<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arena Basica - Match Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Arena Basica</h1>
      <div id="status-bar">
        <span id="tick-info">Tick: 0 / 0</span>
        <span id="match-info">Match: Loading...</span>
      </div>
    </header>

    <main class="arena-layout">
      <div class="canvas-wrapper">
        <canvas id="arenaCanvas" width="500" height="500"></canvas>
      </div>

      <div class="sidebar">
        <h2>Agents</h2>
        <div id="player-list"></div>

        <h2>Event Log</h2>
        <div id="event-log"></div>

        <div class="controls">
          <button id="btn-play">Play</button>
          <button id="btn-prev">Previous</button>
          <button id="btn-next">Next</button>
          <button id="btn-reset">Reset</button>
        </div>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
